<script>
'use strict';
const CONTENT={"subjects":[{"id":"mat","name":"Matemática","short":"Mat","color":"#4260dd","symbol":"∑","area":"Exatas"},{"id":"por","name":"Português","short":"Port","color":"#bd4e6b","symbol":"Aa","area":"Linguagens"},{"id":"fis","name":"Física","short":"Fís","color":"#c2752d","symbol":"λ","area":"Natureza"},{"id":"his","name":"História","short":"Hist","color":"#a158bc","symbol":"H","area":"Humanas"},{"id":"ing","name":"Inglês","short":"Ing","color":"#298875","symbol":"En","area":"Linguagens"},{"id":"bio","name":"Biologia","short":"Bio","color":"#478e42","symbol":"B","area":"Natureza"},{"id":"qui","name":"Química","short":"Quím","color":"#2d8fa6","symbol":"Q","area":"Natureza"},{"id":"geo","name":"Geografia","short":"Geo","color":"#b28a24","symbol":"G","area":"Humanas"},{"id":"fil","name":"Filosofia","short":"Fil","color":"#7c67a9","symbol":"φ","area":"Humanas"},{"id":"soc","name":"Sociologia","short":"Soc","color":"#ae6452","symbol":"S","area":"Humanas"}],"lessons":[{"id":"mat-1","subject":"mat","title":"Equações e sistemas lineares","topic":"Álgebra","source":{"title":"LP e Matemática · volume 1","url":"https://drive.google.com/file/d/15Le7YQpSuhs_l_HBS06Z7FU55C0X8ACP/view"},"minutes":6,"sections":[{"title":"A ideia central","text":"Uma equação expressa uma igualdade e permite determinar uma incógnita. No primeiro grau, ela aparece com expoente 1; no segundo, a forma geral é ax² + bx + c = 0, com a ≠ 0."},{"title":"O que você precisa saber","text":"No segundo grau, Δ = b² − 4ac. Se Δ > 0, há duas raízes reais; se Δ = 0, uma raiz real dupla; se Δ \u003c 0, não há raízes reais. As raízes são (−b ± √Δ)/(2a)."},{"title":"Atenção na prova","text":"Em sistemas, substituição, adição e escalonamento preservam a solução. Um sistema pode ter uma solução (SPD), infinitas (SPI) ou nenhuma (SI)."},{"title":"Na prática","text":"Para x + y = 10 e 2x + y = 14, subtraia a primeira equação da segunda: x = 4. Então y = 6. Confira o par nas duas equações."}],"cards":[{"id":"card-1-1","question":"O que Δ \u003c 0 indica em uma equação do segundo grau?","answer":"Não há raízes reais."},{"id":"card-1-2","question":"O que significa SPI?","answer":"Sistema possível e indeterminado: tem infinitas soluções."},{"id":"card-1-3","question":"Qual cuidado tomar ao multiplicar uma equação de um sistema?","answer":"Multiplicar todos os termos pelo mesmo número não nulo."}]},{"id":"mat-2","subject":"mat","title":"Contagem sem confundir a ordem","topic":"Combinatória","source":{"title":"LP e Matemática · volume 2","url":"https://drive.google.com/file/d/1peZuS6ZvTY5tf78GnjUdDnoZNGz8E-0K/view"},"minutes":6,"sections":[{"title":"A ideia central","text":"O princípio multiplicativo combina etapas: se uma escolha tem m opções e outra tem n, o total é m × n, desde que as restrições já estejam consideradas."},{"title":"O que você precisa saber","text":"Na permutação simples, todos os n elementos distintos são ordenados: n!. No arranjo, ordenamos p entre n: n!/(n−p)!. Na combinação, a ordem não importa: n!/[p!(n−p)!]."},{"title":"Atenção na prova","text":"Antes de escolher uma fórmula, pergunte se há repetição, se a ordem muda o resultado e se todos os elementos são usados."},{"title":"Na prática","text":"Escolher uma dupla entre 5 estudantes é combinação: C(5,2) = 10. Escolher presidente e vice entre os mesmos 5 é arranjo: 5 × 4 = 20."}],"cards":[{"id":"card-2-1","question":"Quando usar combinação simples?","answer":"Quando escolhemos elementos distintos e a ordem não altera o resultado."},{"id":"card-2-2","question":"Quanto vale 4!?","answer":"4 × 3 × 2 × 1 = 24."},{"id":"card-2-3","question":"Quantas sequências de 2 pessoas distintas podem ser feitas entre 5?","answer":"5 × 4 = 20 sequências."}]},{"id":"mat-3","subject":"mat","title":"Probabilidade e eventos","topic":"Probabilidade","source":{"title":"LP e Matemática · volume 2","url":"https://drive.google.com/file/d/1peZuS6ZvTY5tf78GnjUdDnoZNGz8E-0K/view"},"minutes":6,"sections":[{"title":"A ideia central","text":"A probabilidade está entre 0 e 1. Para resultados equiprováveis, P(A) = número de resultados favoráveis / número de resultados possíveis."},{"title":"O que você precisa saber","text":"A união representa A ou B: P(A ∪ B) = P(A) + P(B) − P(A ∩ B). Eventos mutuamente excludentes têm interseção vazia."},{"title":"Atenção na prova","text":"Probabilidade condicional: P(A|B) = P(A ∩ B)/P(B), para P(B) > 0. Independência significa que saber B não muda a probabilidade de A."},{"title":"Na prática","text":"Em um dado justo, A = obter um número par e B = obter número maior que 4. A união é {2,4,5,6}, então P(A ∪ B) = 4/6."}],"cards":[{"id":"card-3-1","question":"Qual é a probabilidade do evento complementar de A?","answer":"1 − P(A)."},{"id":"card-3-2","question":"Eventos independentes são necessariamente mutuamente excludentes?","answer":"Não. Independência e exclusão mútua são conceitos diferentes."},{"id":"card-3-3","question":"Qual a fórmula da interseção de eventos independentes?","answer":"P(A ∩ B) = P(A) × P(B)."}]},{"id":"mat-4","subject":"mat","title":"Trigonometria: do triângulo ao ciclo","topic":"Geometria","source":{"title":"LP e Matemática · volume 3","url":"https://drive.google.com/file/d/1W_bMw20ANDYerRChijH25CviVZrdI6nX/view"},"minutes":6,"sections":[{"title":"A ideia central","text":"No triângulo retângulo, seno é cateto oposto/hipotenusa; cosseno, cateto adjacente/hipotenusa; tangente, cateto oposto/cateto adjacente. Identifique o ângulo antes de escolher os catetos."},{"title":"O que você precisa saber","text":"Na circunferência unitária, o ponto do ângulo θ é (cos θ, sen θ). Os sinais dependem do quadrante. Vale sen²θ + cos²θ = 1."},{"title":"Atenção na prova","text":"A função a + b·sen(c·x + d), com c ≠ 0, tem amplitude |b| e período 2π/|c|, para x em radianos. Em triângulos quaisquer, use a lei dos senos ou dos cossenos."},{"title":"Na prática","text":"Em um triângulo retângulo de lados 3, 4 e 5, o seno do ângulo oposto ao lado 3 é 3/5. Pela lei dos cossenos, a² = b² + c² − 2bc·cos A."}],"cards":[{"id":"card-4-1","question":"Qual é o período de sen(2x), com x em radianos?","answer":"π."},{"id":"card-4-2","question":"Qual é o seno de 30°?","answer":"1/2."},{"id":"card-4-3","question":"No segundo quadrante, quais são os sinais de seno e cosseno?","answer":"Seno positivo e cosseno negativo."}]},{"id":"por-5","subject":"por","title":"Argumentação e gêneros jornalísticos","topic":"Leitura","source":{"title":"LP e Matemática · volume 1","url":"https://drive.google.com/file/d/15Le7YQpSuhs_l_HBS06Z7FU55C0X8ACP/view"},"minutes":6,"sections":[{"title":"A ideia central","text":"A tese é o ponto de vista defendido. Argumentos são razões que o sustentam: dados, exemplos, comparação, causa e consequência ou autoridade."},{"title":"O que você precisa saber","text":"Notícia prioriza informar; editorial expressa a posição de um veículo; artigo de opinião apresenta a perspectiva de seu autor. Reconhecer propósito e interlocutor ajuda a interpretar."},{"title":"Atenção na prova","text":"Refutar é examinar uma objeção e responder a ela. Uma citação só funciona como argumento de autoridade quando é pertinente e sustenta o raciocínio."},{"title":"Na prática","text":"Em “A biblioteca deve abrir à noite, pois muitos estudantes trabalham durante o dia”, a tese é a ampliação do horário; a justificativa é a rotina de trabalho dos estudantes."}],"cards":[{"id":"card-5-1","question":"O que é tese?","answer":"A ideia central ou posição que o texto defende."},{"id":"card-5-2","question":"Qual voz um editorial geralmente representa?","answer":"A posição institucional de um veículo de comunicação."},{"id":"card-5-3","question":"O que significa refutar?","answer":"Responder criticamente a uma posição contrária com argumentos."}]},{"id":"por-6","subject":"por","title":"Modernismo e ruptura estética","topic":"Literatura","source":{"title":"LP e Matemática · volume 2","url":"https://drive.google.com/file/d/1peZuS6ZvTY5tf78GnjUdDnoZNGz8E-0K/view"},"minutes":6,"sections":[{"title":"A ideia central","text":"A Semana de Arte Moderna de 1922 tornou-se um marco de contestação das convenções artísticas. A primeira geração valorizou experimentação, linguagem cotidiana e releitura crítica do Brasil."},{"title":"O que você precisa saber","text":"O Manifesto Antropófago, de 1928, propõe transformar influências culturais estrangeiras em produção própria, sem supor uma cultura pura e isolada."},{"title":"Atenção na prova","text":"Na geração de 1930, a poesia aprofunda tensões individuais e sociais; a prosa regionalista aborda desigualdade, seca, poder e conflitos humanos. Não reduza todos os autores a um único estilo."},{"title":"Na prática","text":"Um poema de versos livres, linguagem coloquial e humor pode dialogar com propostas modernistas. Identifique os recursos presentes no texto, além de conhecer a data do movimento."}],"cards":[{"id":"card-6-1","question":"Qual ano marca a Semana de Arte Moderna?","answer":"1922."},{"id":"card-6-2","question":"O que a antropofagia cultural propõe?","answer":"Assimilar e transformar influências em uma criação cultural própria."},{"id":"card-6-3","question":"Qual tema é frequente na prosa regionalista de 1930?","answer":"Conflitos sociais e humanos ligados a diferentes realidades regionais."}]},{"id":"por-7","subject":"por","title":"Clarice, Rosa, Cabral e Pessoa","topic":"Literatura","source":{"title":"LP e Matemática · volume 3","url":"https://drive.google.com/file/d/1W_bMw20ANDYerRChijH25CviVZrdI6nX/view"},"minutes":6,"sections":[{"title":"A ideia central","text":"Clarice Lispector explora interioridade, percepção e questões existenciais. Em Guimarães Rosa, oralidade, neologismos e sertão se articulam a conflitos universais."},{"title":"O que você precisa saber","text":"João Cabral de Melo Neto é associado ao rigor construtivo e à atenção à realidade social. Morte e vida severina acompanha o percurso de um retirante e problematiza as condições de vida."},{"title":"Atenção na prova","text":"Fernando Pessoa criou heterônimos com biografias, visões de mundo e estilos distintos. Heterônimo não é apenas um nome usado para assinar: é uma personalidade literária construída."},{"title":"Na prática","text":"Ao ler um trecho de Rosa, observe palavras inventadas e marcas de fala; ao ler Cabral, observe a construção precisa dos versos. Use o trecho como evidência para a interpretação."}],"cards":[{"id":"card-7-1","question":"O que é um neologismo?","answer":"Uma palavra, expressão ou sentido novo."},{"id":"card-7-2","question":"Heterônimo e pseudônimo são a mesma coisa?","answer":"Não. O heterônimo tem personalidade e estilo próprios; o pseudônimo é um nome de assinatura."},{"id":"card-7-3","question":"Qual obra de João Cabral apresenta o retirante Severino?","answer":"Morte e vida severina."}]},{"id":"por-8","subject":"por","title":"Redação: tese, desenvolvimento e conclusão","topic":"Escrita","source":{"title":"LP e Matemática · volume 3","url":"https://drive.google.com/file/d/1W_bMw20ANDYerRChijH25CviVZrdI6nX/view"},"minutes":6,"sections":[{"title":"A ideia central","text":"Leia a proposta e delimite o recorte: fugir do tema não é desenvolver um argumento alternativo. Planeje uma tese e razões distintas para sustentá-la."},{"title":"O que você precisa saber","text":"Cada parágrafo de desenvolvimento precisa de uma ideia central, evidência e análise. Repertório não deve aparecer como enfeite: explique sua relação com a tese."},{"title":"Atenção na prova","text":"Na proposta do ENEM, a intervenção deve respeitar os direitos humanos. Identifique agente, ação, meio, finalidade e detalhamento. Outros exames exigem leitura de seus próprios critérios."},{"title":"Na prática","text":"No tema redes sociais e saúde mental, você pode defender educação digital e limites de uso. Explique como as medidas ajudam e quem pode implementá-las, evitando prometer que eliminarão todos os riscos."}],"cards":[{"id":"card-8-1","question":"O que é coerência textual?","answer":"A construção de sentidos compatíveis e de um raciocínio consistente."},{"id":"card-8-2","question":"O que é coesão?","answer":"A articulação linguística entre partes do texto por conectivos, referências e outros recursos."},{"id":"card-8-3","question":"Por que comentar o repertório na redação?","answer":"Para mostrar como ele sustenta a tese, em vez de apenas citar uma referência."}]},{"id":"fis-9","subject":"fis","title":"Cargas, campo e potencial elétrico","topic":"Eletrostática","source":{"title":"História, Física e Inglês · volume 1","url":"https://drive.google.com/file/d/1wg4RnXMbLsU8f6tOU43QZ3o7-K9oXo_8/view"},"minutes":6,"sections":[{"title":"A ideia central","text":"Um corpo fica positivo quando perde elétrons e negativo quando os ganha. Em um sistema eletricamente isolado, a carga total se conserva."},{"title":"O que você precisa saber","text":"Para cargas puntiformes, a intensidade da força de Coulomb é F = k|Qq|/r². Campo elétrico é vetor: E = F/q, considerando direção e sinal da carga de prova."},{"title":"Atenção na prova","text":"Potencial é escalar: V = kQ/r para uma carga puntiforme, com referência no infinito. A força sobre uma carga é F⃗ = qE⃗; uma carga negativa sente força oposta ao campo."},{"title":"Na prática","text":"Se a distância entre duas cargas fixas dobra, a força entre elas passa a 1/4 da intensidade inicial."}],"cards":[{"id":"card-9-1","question":"Se a distância entre cargas dobra, o que ocorre com a força?","answer":"Ela fica quatro vezes menor."},{"id":"card-9-2","question":"Qual o sentido da força sobre uma carga negativa em um campo?","answer":"Oposto ao sentido do campo elétrico."},{"id":"card-9-3","question":"Qual grandeza é escalar: campo ou potencial elétrico?","answer":"Potencial elétrico."}]},{"id":"fis-10","subject":"fis","title":"Circuitos e consumo de energia","topic":"Eletrodinâmica","source":{"title":"História, Física e Inglês · volume 2","url":"https://drive.google.com/file/d/1O77ay3bS6SWnc0Hjf9h0PpK8UWFfvKbU/view"},"minutes":6,"sections":[{"title":"A ideia central","text":"Para um resistor ôhmico em condições constantes, U = R·i. Potência elétrica é P = U·i; para resistores, também P = R·i² = U²/R."},{"title":"O que você precisa saber","text":"Em série, a corrente é a mesma e as resistências se somam. Em paralelo, a tensão é a mesma e 1/R_eq = 1/R₁ + 1/R₂ + … ."},{"title":"Atenção na prova","text":"Energia consumida é potência × tempo. Converta watt em quilowatt antes de calcular kWh. O custo depende da tarifa e pode incluir outras cobranças."},{"title":"Na prática","text":"Um aparelho de 1.000 W ligado por 2 horas consome 2 kWh. A R$ 0,80 por kWh, esse consumo custa R$ 1,60, antes de outros encargos."}],"cards":[{"id":"card-10-1","question":"O que é igual em resistores em paralelo?","answer":"A diferença de potencial em cada ramo."},{"id":"card-10-2","question":"Dois resistores de 6 Ω em paralelo equivalem a quanto?","answer":"3 Ω."},{"id":"card-10-3","question":"Um aparelho de 500 W ligado por 4 h consome quanto?","answer":"2 kWh."}]},{"id":"fis-11","subject":"fis","title":"Magnetismo e força sobre cargas","topic":"Magnetismo","source":{"title":"História, Física e Inglês · volume 3","url":"https://drive.google.com/file/d/1qBkK7EpZZdtumcNG-wdT3CbdnLorh8EI/view"},"minutes":6,"sections":[{"title":"A ideia central","text":"O campo magnético é vetorial. A intensidade da força sobre uma carga em movimento é F = |q|·v·B·sen θ, em que θ é o ângulo entre velocidade e campo."},{"title":"O que você precisa saber","text":"Se velocidade e campo forem paralelos, não há força magnética. Se forem perpendiculares, a força tem intensidade máxima e pode produzir trajetória circular."},{"title":"Atenção na prova","text":"A força magnética é perpendicular à velocidade e, isoladamente, não altera sua intensidade. Para um fio retilíneo longo, B = μ·i/(2πr)."},{"title":"Na prática","text":"Em movimento perpendicular ao campo uniforme, |q|vB = mv²/r. Assim, r = mv/(|q|B). Se B dobra com as demais grandezas fixas, o raio cai pela metade."}],"cards":[{"id":"card-11-1","question":"Quando a força magnética sobre uma carga é nula?","answer":"Quando ela está em repouso ou sua velocidade é paralela ao campo."},{"id":"card-11-2","question":"A força magnética isolada realiza trabalho sobre a carga?","answer":"Não, pois é perpendicular à velocidade."},{"id":"card-11-3","question":"Como o campo de um fio longo varia com a distância?","answer":"É inversamente proporcional à distância ao fio."}]},{"id":"fis-12","subject":"fis","title":"Ondas, reflexão e interferência","topic":"Ondulatória","source":{"title":"História, Física e Inglês · volume 3","url":"https://drive.google.com/file/d/1qBkK7EpZZdtumcNG-wdT3CbdnLorh8EI/view"},"minutes":6,"sections":[{"title":"A ideia central","text":"Uma onda transporta energia sem transportar matéria de forma permanente. A relação fundamental é v = λ·f. Frequência mede oscilações por segundo, em hertz."},{"title":"O que você precisa saber","text":"Reflexão é o retorno da onda após atingir uma interface; refração é a passagem a outro meio. Em uma interface estacionária, a frequência é mantida na refração, mas velocidade e comprimento podem mudar."},{"title":"Atenção na prova","text":"Difração é o espalhamento em obstáculos e aberturas. Interferência é a superposição de ondas; a resultante pode reforçar ou reduzir a amplitude."},{"title":"Na prática","text":"Para uma onda de 340 m/s e 170 Hz, λ = 340/170 = 2 m. Sons de diferentes frequências podem ter a mesma velocidade no mesmo meio, na aproximação usual."}],"cards":[{"id":"card-12-1","question":"Qual relação liga velocidade, comprimento e frequência?","answer":"v = λ·f."},{"id":"card-12-2","question":"O que permanece constante na refração em interface estacionária?","answer":"A frequência."},{"id":"card-12-3","question":"Quando a difração costuma ser mais perceptível?","answer":"Quando o comprimento de onda é comparável ao tamanho do obstáculo ou da abertura."}]},{"id":"his-13","subject":"his","title":"Industrialização e imperialismo","topic":"Século XIX","source":{"title":"História, Física e Inglês · volume 1","url":"https://drive.google.com/file/d/1wg4RnXMbLsU8f6tOU43QZ3o7-K9oXo_8/view"},"minutes":6,"sections":[{"title":"A ideia central","text":"A Segunda Revolução Industrial ampliou o uso de eletricidade, petróleo, aço e novas comunicações. Concentração empresarial e produção em massa mudaram trabalho e consumo."},{"title":"O que você precisa saber","text":"O imperialismo europeu buscou mercados, matérias-primas, investimentos e controle estratégico na África e na Ásia. Explicações racistas foram usadas para legitimar dominação."},{"title":"Atenção na prova","text":"A Conferência de Berlim, em 1884–1885, estabeleceu regras de ocupação e negociação entre potências. Não foi uma divisão neutra nem respeitou a autodeterminação dos povos africanos."},{"title":"Na prática","text":"Ao analisar uma propaganda da “missão civilizadora”, separe a justificativa declarada dos interesses políticos e econômicos que ela pode ocultar."}],"cards":[{"id":"card-13-1","question":"Cite duas novas fontes de energia da Segunda Revolução Industrial.","answer":"Eletricidade e petróleo."},{"id":"card-13-2","question":"O que foi a missão civilizadora no discurso imperialista?","answer":"Uma justificativa ideológica da dominação, frequentemente baseada em racismo e etnocentrismo."},{"id":"card-13-3","question":"Quando ocorreu a Conferência de Berlim?","answer":"Entre 1884 e 1885."}]},{"id":"his-14","subject":"his","title":"Guerras, crise e totalitarismos","topic":"Século XX","source":{"title":"História, Física e Inglês · volume 2","url":"https://drive.google.com/file/d/1O77ay3bS6SWnc0Hjf9h0PpK8UWFfvKbU/view"},"minutes":6,"sections":[{"title":"A ideia central","text":"A Primeira Guerra surgiu de rivalidades nacionais e imperialistas, alianças militares e corrida armamentista. O assassinato em Sarajevo foi o estopim, não a única causa."},{"title":"O que você precisa saber","text":"Após a guerra, instabilidade econômica e social favoreceu projetos autoritários. Fascismo e nazismo mobilizaram nacionalismo, propaganda, violência e repressão de opositores."},{"title":"Atenção na prova","text":"O nazismo promoveu antissemitismo e genocídio. A crise de 1929 e a Segunda Guerra precisam ser estudadas em suas relações e diferenças; não há uma cadeia causal simples e inevitável."},{"title":"Na prática","text":"Em uma fonte de propaganda, identifique o público, a imagem de inimigo, os símbolos e a função política. Propaganda não é evidência neutra da realidade que descreve."}],"cards":[{"id":"card-14-1","question":"O estopim da Primeira Guerra foi sua única causa?","answer":"Não. Havia tensões anteriores entre potências, alianças e rivalidades."},{"id":"card-14-2","question":"Cite dois instrumentos de controle de regimes totalitários.","answer":"Propaganda e repressão política."},{"id":"card-14-3","question":"Qual a política central do nazismo contra a população judaica?","answer":"Perseguição antissemita que culminou no genocídio do Holocausto."}]},{"id":"his-15","subject":"his","title":"Guerra Fria e descolonização","topic":"Pós-guerra","source":{"title":"História, Física e Inglês · volume 3","url":"https://drive.google.com/file/d/1qBkK7EpZZdtumcNG-wdT3CbdnLorh8EI/view"},"minutes":6,"sections":[{"title":"A ideia central","text":"Após 1945, Estados Unidos e União Soviética lideraram blocos rivais. A Guerra Fria envolveu disputas ideológicas, econômicas, tecnológicas e militares."},{"title":"O que você precisa saber","text":"A ausência de guerra direta entre as duas superpotências não significou ausência de guerras. Conflitos locais, intervenções e alianças foram parte da disputa global."},{"title":"Atenção na prova","text":"As independências africanas e asiáticas envolveram diferentes lutas e projetos. Pan-africanismo e autodeterminação contestaram o colonialismo, sem eliminar automaticamente desigualdades e conflitos."},{"title":"Na prática","text":"Plano Marshall e Comecon exemplificam estratégias econômicas dos blocos. OTAN e Pacto de Varsóvia foram alianças militares associadas à bipolaridade."}],"cards":[{"id":"card-15-1","question":"Quais países lideraram os principais blocos da Guerra Fria?","answer":"Estados Unidos e União Soviética."},{"id":"card-15-2","question":"O que é autodeterminação dos povos?","answer":"O direito de decidir sua organização política e seu destino sem dominação externa."},{"id":"card-15-3","question":"O que foi o Plano Marshall?","answer":"Um programa de auxílio econômico dos EUA para a reconstrução europeia, ligado à sua estratégia no pós-guerra."}]},{"id":"his-16","subject":"his","title":"Ditadura, resistência e democracia","topic":"Brasil","source":{"title":"História, Física e Inglês · volume 3","url":"https://drive.google.com/file/d/1qBkK7EpZZdtumcNG-wdT3CbdnLorh8EI/view"},"minutes":6,"sections":[{"title":"A ideia central","text":"O golpe de 1964 depôs João Goulart e inaugurou uma ditadura com apoio de setores civis e comando militar. A análise precisa distinguir os grupos e seus interesses."},{"title":"O que você precisa saber","text":"O AI-5, de 1968, aprofundou a repressão, restringiu direitos e fortaleceu mecanismos de censura e perseguição. Violência estatal atingiu opositores e diversos setores sociais."},{"title":"Atenção na prova","text":"A resistência assumiu várias formas: movimentos estudantis, organização de trabalhadores, arte, imprensa, ação política e, por alguns grupos, luta armada. A redemocratização foi um processo disputado."},{"title":"Na prática","text":"Uma canção censurada pode funcionar como fonte histórica. Compare a letra, a data e o contexto de circulação; não suponha que toda metáfora tenha uma única interpretação."}],"cards":[{"id":"card-16-1","question":"Em que ano ocorreu o golpe que depôs João Goulart?","answer":"1964."},{"id":"card-16-2","question":"O que o AI-5 representou?","answer":"Um aprofundamento do autoritarismo e da repressão a partir de 1968."},{"id":"card-16-3","question":"Cite uma forma de resistência à ditadura além da luta armada.","answer":"Mobilização estudantil, sindical, artística ou política."}]},{"id":"ing-17","subject":"ing","title":"Skimming, scanning e inferência","topic":"Leitura","source":{"title":"História, Física e Inglês · volume 1","url":"https://drive.google.com/file/d/1wg4RnXMbLsU8f6tOU43QZ3o7-K9oXo_8/view"},"minutes":6,"sections":[{"title":"A ideia central","text":"Skimming é uma leitura rápida para captar tema e organização geral. Scanning é a busca de uma informação específica, como nome, data ou número."},{"title":"O que você precisa saber","text":"Use título, gênero, fonte e palavras conhecidas para antecipar o assunto. Depois, confirme a hipótese no texto. Cognatos podem ajudar, mas há falsos cognatos."},{"title":"Atenção na prova","text":"Inferir é concluir algo com base em pistas. Não transforme opinião pessoal em inferência: procure evidências linguísticas e contextuais."},{"title":"Na prática","text":"Em um anúncio com data e local, use scanning para localizar o horário. Para saber se o objetivo é vender, informar ou convencer, observe o conjunto pelo skimming."}],"cards":[{"id":"card-17-1","question":"Para que serve scanning?","answer":"Para localizar rapidamente uma informação específica."},{"id":"card-17-2","question":"O que skimming procura?","answer":"O sentido geral e a organização do texto."},{"id":"card-17-3","question":"Uma inferência deve se apoiar em quê?","answer":"Nas pistas e evidências do texto."}]},{"id":"ing-18","subject":"ing","title":"Conectores: relações entre ideias","topic":"Gramática em contexto","source":{"title":"História, Física e Inglês · volume 3","url":"https://drive.google.com/file/d/1qBkK7EpZZdtumcNG-wdT3CbdnLorh8EI/view"},"minutes":6,"sections":[{"title":"A ideia central","text":"But, however e although sinalizam contraste. Identifique qual ideia é contraposta: traduções isoladas não substituem a leitura da relação."},{"title":"O que você precisa saber","text":"Moreover, besides e in addition introduzem adição. Because, since e due to podem indicar causa; therefore, thus e as a result indicam consequência."},{"title":"Atenção na prova","text":"Pronome e conector organizam a interpretação. Para localizar o referente de it, they ou this, verifique sentido, concordância e a oração anterior."},{"title":"Na prática","text":"“AI is useful. However, it can make mistakes.” O segundo período contrapõe uma limitação ao benefício; it retoma AI."}],"cards":[{"id":"card-18-1","question":"Qual relação however costuma indicar?","answer":"Contraste."},{"id":"card-18-2","question":"Qual relação moreover indica?","answer":"Adição."},{"id":"card-18-3","question":"Em “It rained; therefore, we stayed home”, therefore indica o quê?","answer":"Consequência."}]},{"id":"ing-19","subject":"ing","title":"Gráficos e textos sobre tecnologia","topic":"Leitura de dados","source":{"title":"História, Física e Inglês · volume 2","url":"https://drive.google.com/file/d/1O77ay3bS6SWnc0Hjf9h0PpK8UWFfvKbU/view"},"minutes":6,"sections":[{"title":"A ideia central","text":"Gráficos de barras comparam categorias; linhas mostram mudanças ao longo do tempo; setores representam partes de um todo. Leia unidades e escala."},{"title":"O que você precisa saber","text":"Increase, rise e grow indicam aumento; decrease, fall e drop indicam redução. Stable sugere estabilidade. Palavras como slightly e sharply qualificam a variação."},{"title":"Atenção na prova","text":"Percentual e quantidade absoluta não são iguais. Compare o período e a base de referência antes de concluir que a mudança é maior."},{"title":"Na prática","text":"“The number rose from 20 to 30” significa aumento de 10 unidades ou 50% em relação ao valor inicial, não de 10%."}],"cards":[{"id":"card-19-1","question":"O que “decrease” significa em um gráfico?","answer":"Diminuir ou redução."},{"id":"card-19-2","question":"Por que ler as unidades do gráfico?","answer":"Para interpretar corretamente o que está sendo medido."},{"id":"card-19-3","question":"De 20 para 30, qual é o aumento percentual?","answer":"50%."}]},{"id":"ing-20","subject":"ing","title":"IA, ética e leitura crítica","topic":"Tecnologia","source":{"title":"História, Física e Inglês · volume 3","url":"https://drive.google.com/file/d/1qBkK7EpZZdtumcNG-wdT3CbdnLorh8EI/view"},"minutes":6,"sections":[{"title":"A ideia central","text":"Textos sobre inteligência artificial discutem benefícios, limitações e escolhas humanas. Procure a ideia central e a posição do autor, sem assumir que ele aprova ou rejeita toda tecnologia."},{"title":"O que você precisa saber","text":"Bias significa viés; em contextos sociais, pode indicar padrões de discriminação. Flawed data são dados falhos. Um sistema pode reproduzir problemas dos dados e do projeto."},{"title":"Atenção na prova","text":"Vocabulário de trabalho inclui skills (habilidades), wages (salários) e replace (substituir). Diferencie uma possibilidade expressa com may de uma certeza."},{"title":"Na prática","text":"“AI may change jobs” indica possibilidade. “AI will change every job in the same way” seria uma generalização mais forte e diferente."}],"cards":[{"id":"card-20-1","question":"O que bias significa nesse contexto?","answer":"Viés, que pode reproduzir preconceitos ou discriminação."},{"id":"card-20-2","question":"Qual sentido may pode expressar?","answer":"Possibilidade."},{"id":"card-20-3","question":"O que skills significa?","answer":"Habilidades."}]},{"id":"bio-21","subject":"bio","title":"Célula e suas organelas","topic":"Citologia","source":{"title":"SARESP 2025 · Linguagens e Natureza","url":"https://drive.google.com/file/d/10ls6FfeuSgqT-g-CjI-mUMoVoZLRmLAh/view"},"minutes":6,"sections":[{"title":"A ideia central","text":"Células eucarióticas possuem núcleo delimitado e organelas membranosas. Ribossomos, presentes também em procariontes, participam da síntese de proteínas."},{"title":"O que você precisa saber","text":"Mitocôndrias atuam na respiração celular; cloroplastos, na fotossíntese de plantas e algas. Lisossomos participam da digestão intracelular."},{"title":"Atenção na prova","text":"A função depende da interação entre estruturas. O material genético orienta a produção de moléculas, mas o ambiente e a regulação também influenciam a atividade celular."},{"title":"Na prática","text":"Acúmulo de substâncias que deveriam ser degradadas pode estar ligado a falhas em processos de digestão intracelular. Analise a descrição do processo, não apenas o nome da doença."}],"cards":[{"id":"card-21-1","question":"Qual estrutura realiza a síntese de proteínas?","answer":"Ribossomo."},{"id":"card-21-2","question":"Qual organela participa da digestão intracelular?","answer":"Lisossomo."},{"id":"card-21-3","question":"Procariontes têm núcleo delimitado por membrana?","answer":"Não."}]},{"id":"bio-22","subject":"bio","title":"DNA, expressão gênica e herança","topic":"Genética","source":{"title":"SARESP 2025 · Linguagens e Natureza","url":"https://drive.google.com/file/d/10ls6FfeuSgqT-g-CjI-mUMoVoZLRmLAh/view"},"minutes":6,"sections":[{"title":"A ideia central","text":"Na transcrição, informação do DNA orienta a formação de RNA. Na tradução, a sequência do RNA mensageiro orienta a produção de uma cadeia de aminoácidos."},{"title":"O que você precisa saber","text":"Em herança autossômica dominante, uma cópia do alelo pode ser suficiente para o fenótipo. Dominante não significa mais frequente nem melhor."},{"title":"Atenção na prova","text":"Genótipo é a constituição genética; fenótipo é a característica observável resultante da interação entre genótipo e ambiente. Heredogramas exigem leitura de símbolos e relações familiares."},{"title":"Na prática","text":"Em um cruzamento Aa × aa com dominância completa, a chance de um descendente receber A é 1/2. Cada nascimento é um novo evento."}],"cards":[{"id":"card-22-1","question":"O que a transcrição produz?","answer":"RNA a partir de informação do DNA."},{"id":"card-22-2","question":"Dominante significa mais frequente na população?","answer":"Não."},{"id":"card-22-3","question":"O ambiente pode afetar o fenótipo?","answer":"Sim. O fenótipo resulta da interação entre genótipo e ambiente."}]},{"id":"bio-23","subject":"bio","title":"Evolução, seleção e ancestralidade","topic":"Evolução","source":{"title":"Fuvest 2025 · primeira fase V1","url":"https://drive.google.com/file/d/1QDaZh3FS1zxv7f4UNo_REyo_bMqTLLe8/view"},"minutes":6,"sections":[{"title":"A ideia central","text":"A seleção natural atua sobre diferenças hereditárias entre indivíduos. Características que aumentam o sucesso reprodutivo podem se tornar mais frequentes ao longo das gerações."},{"title":"O que você precisa saber","text":"Indivíduos não evoluem por necessidade durante a vida. Populações mudam geneticamente ao longo de gerações, com mutação, seleção, deriva e fluxo gênico."},{"title":"Atenção na prova","text":"Cladogramas representam hipóteses de parentesco. Um nó indica ancestral comum; proximidade visual no desenho não é suficiente para estabelecer parentesco."},{"title":"Na prática","text":"O uso de antibióticos pode selecionar bactérias resistentes já presentes ou originadas por variação. Não significa que cada bactéria desenvolveu resistência por vontade ou esforço."}],"cards":[{"id":"card-23-1","question":"Em que nível ocorre a mudança evolutiva ao longo das gerações?","answer":"Nas populações."},{"id":"card-23-2","question":"O que um nó em um cladograma representa?","answer":"Um ancestral comum."},{"id":"card-23-3","question":"O antibiótico seleciona qual tipo de bactéria em uma população variável?","answer":"As resistentes têm maior chance de sobreviver e se reproduzir nesse contexto."}]},{"id":"bio-24","subject":"bio","title":"Ecologia e ciclo do nitrogênio","topic":"Ecologia","source":{"title":"SARESP 2025 · Linguagens e Natureza","url":"https://drive.google.com/file/d/10ls6FfeuSgqT-g-CjI-mUMoVoZLRmLAh/view"},"minutes":6,"sections":[{"title":"A ideia central","text":"Ecossistemas incluem seres vivos e fatores físicos. Matéria circula em ciclos; energia flui pelas cadeias e parte se dissipa como calor a cada nível."},{"title":"O que você precisa saber","text":"O nitrogênio atmosférico não é diretamente aproveitado pela maioria das plantas. Microrganismos realizam etapas como fixação e nitrificação."},{"title":"Atenção na prova","text":"Leguminosas podem se associar a bactérias fixadoras. A adubação verde incorpora biomassa ao solo e pode contribuir para sua fertilidade, dependendo do manejo."},{"title":"Na prática","text":"Uma lavoura com leguminosas associadas a bactérias pode aumentar a disponibilidade de compostos nitrogenados. Evite confundir fixação do nitrogênio com fotossíntese."}],"cards":[{"id":"card-24-1","question":"A energia é reciclada da mesma forma que a matéria no ecossistema?","answer":"Não. A energia flui e se dissipa; a matéria participa de ciclos."},{"id":"card-24-2","question":"Quem realiza a fixação biológica do nitrogênio?","answer":"Determinados microrganismos."},{"id":"card-24-3","question":"A maioria das plantas utiliza diretamente o N₂ atmosférico?","answer":"Não."}]},{"id":"qui-25","subject":"qui","title":"Átomo e organização periódica","topic":"Química geral","source":{"title":"SARESP 2025 · Linguagens e Natureza","url":"https://drive.google.com/file/d/10ls6FfeuSgqT-g-CjI-mUMoVoZLRmLAh/view"},"minutes":6,"sections":[{"title":"A ideia central","text":"O número atômico Z corresponde ao número de prótons. Em átomo neutro, elétrons e prótons têm a mesma quantidade. Íons resultam de perda ou ganho de elétrons."},{"title":"O que você precisa saber","text":"Isótopos têm o mesmo Z e diferentes números de nêutrons. Número de massa A é a soma de prótons e nêutrons."},{"title":"Atenção na prova","text":"A tabela organiza elementos por Z crescente. Tendências como raio e eletronegatividade auxiliam comparações, mas exigem atenção ao grupo, período e exceções."},{"title":"Na prática","text":"Para A = 23 e Z = 11, há 12 nêutrons. Se o átomo perde um elétron, tem 10 elétrons e carga +1."}],"cards":[{"id":"card-25-1","question":"O que define o elemento químico?","answer":"O número de prótons, ou número atômico."},{"id":"card-25-2","question":"O que são isótopos?","answer":"Átomos do mesmo elemento com diferentes números de nêutrons."},{"id":"card-25-3","question":"Se um átomo perde elétrons, qual o sinal de seu íon?","answer":"Positivo."}]},{"id":"qui-26","subject":"qui","title":"Quantidade de matéria e estequiometria","topic":"Cálculos químicos","source":{"title":"SARESP 2025 · Linguagens e Natureza","url":"https://drive.google.com/file/d/10ls6FfeuSgqT-g-CjI-mUMoVoZLRmLAh/view"},"minutes":6,"sections":[{"title":"A ideia central","text":"Mol é uma unidade de quantidade de matéria. A relação n = m/M liga quantidade, massa e massa molar. Use unidades compatíveis."},{"title":"O que você precisa saber","text":"Balancear conserva os átomos de cada elemento. Coeficientes indicam proporções entre quantidades de matéria; não altere índices das fórmulas para balancear."},{"title":"Atenção na prova","text":"Em reações com vários reagentes, identifique o limitante: ele determina a quantidade máxima de produto. Rendimento real pode ser menor que o teórico."},{"title":"Na prática","text":"Na reação 2H₂ + O₂ → 2H₂O, 2 mol de H₂ exigem 1 mol de O₂ e podem gerar 2 mol de água, com reação completa."}],"cards":[{"id":"card-26-1","question":"Qual relação liga massa e quantidade de matéria?","answer":"n = m/M."},{"id":"card-26-2","question":"Pode alterar índices das fórmulas para balancear uma reação?","answer":"Não. Ajuste os coeficientes."},{"id":"card-26-3","question":"Qual reagente limita a produção máxima?","answer":"O reagente limitante, que se esgota primeiro conforme a proporção da reação."}]},{"id":"qui-27","subject":"qui","title":"Soluções, concentração e diluição","topic":"Físico-química","source":{"title":"SARESP 2025 · Linguagens e Natureza","url":"https://drive.google.com/file/d/10ls6FfeuSgqT-g-CjI-mUMoVoZLRmLAh/view"},"minutes":6,"sections":[{"title":"A ideia central","text":"Concentração comum é massa de soluto por volume de solução. Concentração molar é quantidade de matéria do soluto por volume de solução."},{"title":"O que você precisa saber","text":"Em diluição sem perda de soluto, a quantidade de soluto permanece constante. Assim, C₁V₁ = C₂V₂ para concentrações na mesma unidade."},{"title":"Atenção na prova","text":"Não confunda volume de solvente adicionado com volume final da solução. Converta mL e L antes dos cálculos."},{"title":"Na prática","text":"Diluir 100 mL de solução 2 mol/L até 500 mL produz concentração 0,4 mol/L: 2 × 100/500."}],"cards":[{"id":"card-27-1","question":"O que se conserva em uma diluição sem perda de soluto?","answer":"A quantidade de soluto."},{"id":"card-27-2","question":"Qual fórmula relaciona concentrações e volumes na diluição?","answer":"C₁V₁ = C₂V₂."},{"id":"card-27-3","question":"100 mL correspondem a quantos litros?","answer":"0,1 L."}]},{"id":"qui-28","subject":"qui","title":"Oxirredução e energia","topic":"Reações","source":{"title":"SARESP 2025 · Linguagens e Natureza","url":"https://drive.google.com/file/d/10ls6FfeuSgqT-g-CjI-mUMoVoZLRmLAh/view"},"minutes":6,"sections":[{"title":"A ideia central","text":"Oxidação é perda de elétrons e aumento do número de oxidação. Redução é ganho de elétrons e diminuição do número de oxidação."},{"title":"O que você precisa saber","text":"O agente oxidante sofre redução; o agente redutor sofre oxidação. Analise a espécie antes e depois da reação."},{"title":"Atenção na prova","text":"Reações exotérmicas liberam energia; endotérmicas absorvem. Sistemas de baterias e combustíveis relacionam transformação química e energia disponível."},{"title":"Na prática","text":"Se Zn passa de NOX 0 para +2, é oxidado. Se Cu²⁺ passa para Cu de NOX 0, é reduzido."}],"cards":[{"id":"card-28-1","question":"Na oxidação, o NOX aumenta ou diminui?","answer":"Aumenta."},{"id":"card-28-2","question":"O agente oxidante sofre qual processo?","answer":"Redução."},{"id":"card-28-3","question":"Uma reação exotérmica libera ou absorve calor?","answer":"Libera calor para o ambiente."}]},{"id":"geo-29","subject":"geo","title":"Cartografia e leitura de mapas","topic":"Cartografia","source":{"title":"Fuvest 2025 · primeira fase V1","url":"https://drive.google.com/file/d/1QDaZh3FS1zxv7f4UNo_REyo_bMqTLLe8/view"},"minutes":6,"sections":[{"title":"A ideia central","text":"Escala é a relação entre distância no mapa e distância real. Na escala 1:n, uma unidade no mapa equivale a n unidades reais."},{"title":"O que você precisa saber","text":"Legenda, orientação, fonte, data e projeção fazem parte da leitura. Mapas são representações seletivas: cada escolha destaca alguns aspectos."},{"title":"Atenção na prova","text":"Escala maior tem denominador menor e geralmente permite mais detalhe. Projeções distorcem área, forma, distância ou direção; nenhuma representação plana conserva tudo."},{"title":"Na prática","text":"Em 1:100.000, 3 cm no mapa equivalem a 300.000 cm reais, ou 3 km."}],"cards":[{"id":"card-29-1","question":"Na escala 1:100.000, 1 cm no mapa vale quanto?","answer":"1 km na realidade."},{"id":"card-29-2","question":"Qual escala é maior: 1:10.000 ou 1:1.000.000?","answer":"1:10.000."},{"id":"card-29-3","question":"Por que ler a data de um mapa?","answer":"Porque o fenômeno representado pode mudar ao longo do tempo."}]},{"id":"geo-30","subject":"geo","title":"Clima, cidades e enchentes","topic":"Climatologia","source":{"title":"Fuvest 2025 · primeira fase V1","url":"https://drive.google.com/file/d/1QDaZh3FS1zxv7f4UNo_REyo_bMqTLLe8/view"},"minutes":6,"sections":[{"title":"A ideia central","text":"Tempo é a condição atmosférica em um momento; clima reúne padrões observados em períodos longos. Climogramas articulam temperatura e precipitação."},{"title":"O que você precisa saber","text":"Ilhas de calor urbanas se relacionam a materiais, pouca vegetação, emissões e configuração da cidade. Impermeabilização pode aumentar escoamento superficial."},{"title":"Atenção na prova","text":"Enchentes resultam da interação entre precipitação, relevo, drenagem, ocupação e infraestrutura. O risco social também depende de vulnerabilidade e capacidade de resposta."},{"title":"Na prática","text":"Uma área arborizada pode ter temperatura menor que uma área densamente construída. Para explicar a diferença, examine uso do solo e condições locais."}],"cards":[{"id":"card-30-1","question":"Qual é a diferença entre tempo e clima?","answer":"Tempo é momentâneo; clima corresponde a padrões de longo prazo."},{"id":"card-30-2","question":"O que a impermeabilização tende a aumentar?","answer":"O escoamento superficial da água."},{"id":"card-30-3","question":"Cite um fator associado às ilhas de calor.","answer":"Baixa cobertura vegetal ou concentração de superfícies que absorvem e reemitem calor."}]},{"id":"geo-31","subject":"geo","title":"Agricultura, biomas e Matopiba","topic":"Brasil","source":{"title":"SARESP 2025 · Matemática e Humanas","url":"https://drive.google.com/file/d/1vdYDc1NrKWHXnSF1JagDXyjUq7edorXp/view"},"minutes":6,"sections":[{"title":"A ideia central","text":"Matopiba é uma região ligada à expansão da fronteira agrícola envolvendo Maranhão, Tocantins, Piauí e Bahia. Parte importante da expansão ocorre no Cerrado."},{"title":"O que você precisa saber","text":"Monocultura, infraestrutura, crédito e inserção no comércio de commodities ajudam a explicar a transformação territorial. Há conflitos ambientais e fundiários."},{"title":"Atenção na prova","text":"Não descreva biomas como espaços vazios: há biodiversidade, ocupações humanas e diferentes usos. Relacione vegetação, solo, água e formas de apropriação."},{"title":"Na prática","text":"Compare uma imagem antes e depois do desmatamento com atenção à escala e à data. Uma fotografia não explica sozinha quem transformou o território ou por quê."}],"cards":[{"id":"card-31-1","question":"Quais estados dão origem ao nome Matopiba?","answer":"Maranhão, Tocantins, Piauí e Bahia."},{"id":"card-31-2","question":"Qual bioma é central na expansão agrícola do Matopiba?","answer":"Cerrado."},{"id":"card-31-3","question":"O que é monocultura?","answer":"Cultivo predominante de uma espécie agrícola em uma área."}]},{"id":"geo-32","subject":"geo","title":"Geopolítica e circulação mundial","topic":"Mundo","source":{"title":"SARESP 2025 · Matemática e Humanas","url":"https://drive.google.com/file/d/1vdYDc1NrKWHXnSF1JagDXyjUq7edorXp/view"},"minutes":6,"sections":[{"title":"A ideia central","text":"Estados, organizações, empresas e movimentos disputam poder, recursos e influência. Fronteiras não coincidem necessariamente com identidades nacionais."},{"title":"O que você precisa saber","text":"A questão curda envolve uma população distribuída entre vários países e diferentes reivindicações políticas. Evite presumir que todos os grupos defendem a mesma estratégia."},{"title":"Atenção na prova","text":"Rotas marítimas e canais são estratégicos para o comércio. Mudanças climáticas podem alterar condições de circulação, mas benefícios econômicos não anulam impactos ambientais."},{"title":"Na prática","text":"Ao ler um texto sobre BRICS e moedas, distinga uma proposta política de uma mudança já efetivada. Procure a data e a fonte da informação."}],"cards":[{"id":"card-32-1","question":"O que é um povo sem Estado?","answer":"Uma população com identidade coletiva que não possui um Estado soberano próprio."},{"id":"card-32-2","question":"Por que canais marítimos têm importância geopolítica?","answer":"Concentram rotas e reduzem distâncias no comércio e na circulação."},{"id":"card-32-3","question":"Uma proposta anunciada equivale a uma medida já implementada?","answer":"Não. É preciso verificar seu estágio e sua aplicação."}]},{"id":"fil-33","subject":"fil","title":"Empirismo e construção do conhecimento","topic":"Conhecimento","source":{"title":"SARESP 2025 · Matemática e Humanas","url":"https://drive.google.com/file/d/1vdYDc1NrKWHXnSF1JagDXyjUq7edorXp/view"},"minutes":6,"sections":[{"title":"A ideia central","text":"O empirismo destaca a experiência como fonte do conhecimento. Locke argumenta contra ideias inatas e analisa sensação e reflexão."},{"title":"O que você precisa saber","text":"Sensação envolve contato com o mundo pelos sentidos. Reflexão é a consideração das operações da própria mente. Isso não significa que todo relato sensorial seja infalível."},{"title":"Atenção na prova","text":"Compare empirismo e racionalismo sem caricatura: são posições sobre origem e justificação do conhecimento, com diferenças entre autores."},{"title":"Na prática","text":"Observar uma planta ajuda a formar ideias sobre sua aparência; examinar como lembramos dessa observação é um exemplo de reflexão sobre atividade mental."}],"cards":[{"id":"card-33-1","question":"Qual fonte do conhecimento o empirismo enfatiza?","answer":"A experiência."},{"id":"card-33-2","question":"Qual filósofo dos materiais é associado ao empirismo?","answer":"John Locke."},{"id":"card-33-3","question":"O empirismo necessariamente afirma que os sentidos nunca erram?","answer":"Não."}]},{"id":"fil-34","subject":"fil","title":"Estoicismo e liberdade interior","topic":"Ética","source":{"title":"SARESP 2025 · Matemática e Humanas","url":"https://drive.google.com/file/d/1vdYDc1NrKWHXnSF1JagDXyjUq7edorXp/view"},"minutes":6,"sections":[{"title":"A ideia central","text":"O estoicismo propõe orientar a vida pela razão e distinguir o que depende de nós do que não depende. Não é simplesmente deixar de sentir."},{"title":"O que você precisa saber","text":"Juízos, escolhas e atitudes merecem atenção; eventos externos podem escapar ao controle. A prática envolve examinar como respondemos aos acontecimentos."},{"title":"Atenção na prova","text":"Aceitar limites não implica apoiar injustiças ou abandonar a vida coletiva. Interpretações em memes podem exagerar ou simplificar o pensamento."},{"title":"Na prática","text":"Não controlar o resultado de uma prova não elimina a responsabilidade de estudar. Preparação e escolhas estão em um campo de ação diferente do resultado final."}],"cards":[{"id":"card-34-1","question":"Qual distinção é importante no estoicismo?","answer":"Entre o que depende de nós e o que não depende."},{"id":"card-34-2","question":"Estoicismo significa ausência total de emoções?","answer":"Não."},{"id":"card-34-3","question":"Um meme filosófico deve ser lido como explicação completa de uma escola?","answer":"Não. Ele pode simplificar e distorcer conceitos."}]},{"id":"fil-35","subject":"fil","title":"Argumentos, falácias e justiça","topic":"Filosofia política","source":{"title":"Fuvest 2025 · primeira fase V1","url":"https://drive.google.com/file/d/1QDaZh3FS1zxv7f4UNo_REyo_bMqTLLe8/view"},"minutes":6,"sections":[{"title":"A ideia central","text":"Argumentar exige relacionar premissas e conclusão. Uma conclusão convincente emocionalmente não é necessariamente sustentada logicamente."},{"title":"O que você precisa saber","text":"Falácias são problemas de raciocínio. Atacar a pessoa em vez de sua tese é ad hominem; apresentar só duas opções quando existem outras é um falso dilema."},{"title":"Atenção na prova","text":"Discussões sobre justiça distinguem aplicação consistente de regras e avaliação do conteúdo dessas regras. Cumprir uma regra não demonstra sozinho que ela é justa."},{"title":"Na prática","text":"“Você é jovem, então sua proposta está errada” não avalia a proposta. Já mostrar uma contradição entre seus dados e sua conclusão enfrenta o argumento."}],"cards":[{"id":"card-35-1","question":"O que é ad hominem?","answer":"Um ataque à pessoa usado no lugar de responder ao argumento."},{"id":"card-35-2","question":"O que é falso dilema?","answer":"Tratar duas alternativas como únicas, ignorando outras possibilidades relevantes."},{"id":"card-35-3","question":"Aplicar uma regra igualmente prova que seu conteúdo é justo?","answer":"Não necessariamente."}]},{"id":"fil-36","subject":"fil","title":"Senso comum, ciência e mídia","topic":"Conhecimento","source":{"title":"SARESP 2025 · Matemática e Humanas","url":"https://drive.google.com/file/d/1vdYDc1NrKWHXnSF1JagDXyjUq7edorXp/view"},"minutes":6,"sections":[{"title":"A ideia central","text":"Senso comum reúne saberes cotidianos, tradições e experiências. Pode ser útil, mas não substitui métodos de investigação quando uma afirmação exige comprovação."},{"title":"O que você precisa saber","text":"Conhecimento científico depende de procedimentos, evidências, crítica e possibilidade de revisão. Ciência não é apenas opinião de alguém com prestígio."},{"title":"Atenção na prova","text":"Meios de comunicação selecionam temas e formas de apresentação. Para avaliar uma mensagem, examine fonte, evidência e interesses, sem concluir que toda mídia é falsa."},{"title":"Na prática","text":"Uma crença alimentar transmitida na família deve ser investigada com evidências adequadas. A repetição e a popularidade de uma afirmação não garantem sua verdade."}],"cards":[{"id":"card-36-1","question":"Uma afirmação repetida muitas vezes está automaticamente comprovada?","answer":"Não."},{"id":"card-36-2","question":"O conhecimento científico pode ser revisado?","answer":"Sim, diante de novas evidências e análises."},{"id":"card-36-3","question":"Cite um cuidado ao avaliar uma notícia.","answer":"Verificar a fonte e as evidências, além de seu contexto."}]},{"id":"soc-37","subject":"soc","title":"Gênero e desigualdades sociais","topic":"Desigualdade","source":{"title":"SARESP 2025 · Matemática e Humanas","url":"https://drive.google.com/file/d/1vdYDc1NrKWHXnSF1JagDXyjUq7edorXp/view"},"minutes":6,"sections":[{"title":"A ideia central","text":"Gênero se relaciona a normas, expectativas e papéis socialmente construídos. As experiências variam com classe, raça, idade e outros marcadores."},{"title":"O que você precisa saber","text":"Desigualdade salarial e divisão do trabalho de cuidado exigem análise de estruturas e práticas. Diferenças observadas não provam, sozinhas, uma causa biológica."},{"title":"Atenção na prova","text":"Interseccionalidade ajuda a examinar como formas de desigualdade se articulam. Evite tratar grupos como se todas as pessoas tivessem a mesma experiência."},{"title":"Na prática","text":"Ao comparar rendimentos de influenciadores, examine amostra, distribuição, tipo de atividade e outras variáveis. Um percentual isolado não explica todo o fenômeno."}],"cards":[{"id":"card-37-1","question":"O que interseccionalidade ajuda a analisar?","answer":"A articulação de diferentes formas de desigualdade e discriminação."},{"id":"card-37-2","question":"Trabalho de cuidado inclui apenas trabalho remunerado?","answer":"Não. Também inclui atividades não remuneradas, frequentemente realizadas no âmbito familiar."},{"id":"card-37-3","question":"Uma correlação entre gênero e renda prova uma causa biológica?","answer":"Não."}]},{"id":"soc-38","subject":"soc","title":"Weber, ação social e capitalismo","topic":"Teoria social","source":{"title":"Fuvest 2025 · primeira fase V1","url":"https://drive.google.com/file/d/1QDaZh3FS1zxv7f4UNo_REyo_bMqTLLe8/view"},"minutes":6,"sections":[{"title":"A ideia central","text":"Para Weber, a ação social é orientada por um sentido e leva em conta outras pessoas. A análise busca compreender esse sentido e suas relações."},{"title":"O que você precisa saber","text":"A Ética Protestante e o Espírito do Capitalismo examina relações entre valores religiosos e condutas econômicas. Não afirma que uma única religião criou sozinha o capitalismo."},{"title":"Atenção na prova","text":"Causas históricas são complexas. Distinguir afinidades, influências e determinação automática é importante na interpretação de textos sociológicos."},{"title":"Na prática","text":"Trabalhar intensamente pode ter sentidos diferentes: sustentar a família, cumprir um dever moral ou buscar lucro. A interpretação deve considerar contexto e motivação."}],"cards":[{"id":"card-38-1","question":"O que caracteriza ação social em Weber?","answer":"Uma ação com sentido orientado em relação a outras pessoas."},{"id":"card-38-2","question":"Weber atribui o capitalismo a uma única causa religiosa?","answer":"Não."},{"id":"card-38-3","question":"O que interpretar uma ação exige além de observar o gesto?","answer":"Compreender seu sentido e seu contexto social."}]},{"id":"soc-39","subject":"soc","title":"Cultura, identidade e colonialismo","topic":"Cultura","source":{"title":"Fuvest 2025 · primeira fase V1","url":"https://drive.google.com/file/d/1QDaZh3FS1zxv7f4UNo_REyo_bMqTLLe8/view"},"minutes":6,"sections":[{"title":"A ideia central","text":"Cultura envolve práticas, valores, linguagem e formas de significação. Ela muda e se constrói em relações; não é um conjunto fixo de traços naturais."},{"title":"O que você precisa saber","text":"Etnocentrismo avalia outras culturas com os critérios da própria, frequentemente hierarquizando-as. Relativizar pede compreensão do contexto, sem impedir debate ético."},{"title":"Atenção na prova","text":"A circulação de artefatos indígenas por museus envolve memória, poder, pertencimento e direitos. Não reduza objetos a decoração nem povos a imagens do passado."},{"title":"Na prática","text":"Ao comparar a fala de um autor indígena com a apresentação de um museu, examine quem narra, quais interesses aparecem e que significados são atribuídos aos objetos."}],"cards":[{"id":"card-39-1","question":"O que é etnocentrismo?","answer":"Julgar e hierarquizar outras culturas pelos padrões da própria cultura."},{"id":"card-39-2","question":"Cultura é imutável?","answer":"Não. Ela se transforma historicamente."},{"id":"card-39-3","question":"Por que considerar a voz dos povos de origem ao estudar artefatos?","answer":"Porque os objetos têm significados e relações de pertencimento que a descrição externa pode omitir."}]},{"id":"soc-40","subject":"soc","title":"Redes sociais, opinião e trabalho","topic":"Sociedade digital","source":{"title":"SARESP 2025 · Matemática e Humanas","url":"https://drive.google.com/file/d/1vdYDc1NrKWHXnSF1JagDXyjUq7edorXp/view"},"minutes":6,"sections":[{"title":"A ideia central","text":"Redes sociais conectam comunicação, publicidade, trabalho e consumo. Plataformas selecionam conteúdos por sistemas que podem influenciar visibilidade."},{"title":"O que você precisa saber","text":"A economia de influência envolve rendimentos desiguais e relações com empresas e audiências. Popularidade não significa, necessariamente, estabilidade de renda ou qualidade de informação."},{"title":"Atenção na prova","text":"Cultura do cancelamento e circulação de notícias pedem análise dos conflitos, dos efeitos e das evidências. Evite generalizar toda crítica pública como o mesmo fenômeno."},{"title":"Na prática","text":"Antes de compartilhar um gráfico, confira se o percentual descreve a população ou apenas a amostra. Observe se o autor diferencia associação estatística e causalidade."}],"cards":[{"id":"card-40-1","question":"Popularidade de uma postagem garante informação correta?","answer":"Não."},{"id":"card-40-2","question":"O que distinguir ao interpretar uma estatística sobre redes sociais?","answer":"Associação e causalidade, além da amostra e do contexto."},{"id":"card-40-3","question":"A visibilidade nas plataformas é totalmente neutra?","answer":"Não. Há escolhas e mecanismos de seleção de conteúdo."}]}],"questions":[{"subject":"mat","prompt":"Um sistema tem as equações x + y = 12 e x − y = 4. Qual é o valor de x?","options":["4","6","8","12","16"],"correct":2,"explanation":"Somando as equações: 2x = 16. Portanto x = 8 e y = 4.","id":"q-1","kind":"Questão autoral de treino"},{"subject":"mat","prompt":"Quantas duplas diferentes podem ser escolhidas entre 6 estudantes?","options":["12","15","24","30","36"],"correct":1,"explanation":"A ordem da dupla não importa: C(6,2) = 6×5/2 = 15.","id":"q-2","kind":"Questão autoral de treino"},{"subject":"mat","prompt":"Em um dado justo, qual é a probabilidade de obter número par ou maior que 4?","options":["1/6","1/3","1/2","2/3","5/6"],"correct":3,"explanation":"A união de {2,4,6} e {5,6} é {2,4,5,6}. São 4 resultados em 6: 2/3.","id":"q-3","kind":"Questão autoral de treino"},{"subject":"por","prompt":"Em “A leitura deve ser incentivada porque amplia o repertório”, o trecho inicial apresenta:","options":["Uma objeção","A tese defendida","Um dado estatístico","Uma citação de autoridade","Uma descrição neutra"],"correct":1,"explanation":"A tese é a posição defendida: incentivar a leitura. A oração com “porque” introduz a justificativa.","id":"q-4","kind":"Questão autoral de treino"},{"subject":"por","prompt":"A criação de autores fictícios com estilos e biografias próprios, em Fernando Pessoa, é chamada de:","options":["Paródia","Metonímia","Heteronímia","Naturalismo","Aliteração"],"correct":2,"explanation":"Heterônimos são personalidades literárias próprias. Não são apenas nomes usados para assinar.","id":"q-5","kind":"Questão autoral de treino"},{"subject":"por","prompt":"Qual recurso consiste em atribuir características humanas a seres não humanos?","options":["Antítese","Hipérbato","Metonímia","Personificação","Eufemismo"],"correct":3,"explanation":"Personificação, ou prosopopeia, atribui ações ou características humanas a seres não humanos.","id":"q-6","kind":"Questão autoral de treino"},{"subject":"fis","prompt":"Um aparelho de 600 W funciona por 5 horas. Qual energia ele consome?","options":["0,3 kWh","1,2 kWh","3 kWh","5 kWh","30 kWh"],"correct":2,"explanation":"600 W = 0,6 kW. Energia = 0,6 × 5 = 3 kWh.","id":"q-7","kind":"Questão autoral de treino"},{"subject":"fis","prompt":"A distância entre duas cargas puntiformes dobra. Mantidas as cargas, a força elétrica passa a ser:","options":["Duas vezes maior","Quatro vezes maior","A metade","Um quarto","A mesma"],"correct":3,"explanation":"A força de Coulomb é proporcional a 1/r². Dobrando r, a força é dividida por 4.","id":"q-8","kind":"Questão autoral de treino"},{"subject":"fis","prompt":"Uma onda tem velocidade de 300 m/s e frequência de 150 Hz. Seu comprimento de onda é:","options":["0,5 m","1 m","2 m","150 m","450 m"],"correct":2,"explanation":"De v = λf, λ = 300/150 = 2 m.","id":"q-9","kind":"Questão autoral de treino"},{"subject":"his","prompt":"A expressão “missão civilizadora”, no contexto imperialista, funcionou principalmente como:","options":["Reconhecimento da autodeterminação","Justificativa ideológica da dominação","Defesa da igualdade cultural","Programa de independência","Abolição das hierarquias raciais"],"correct":1,"explanation":"O discurso frequentemente ocultava interesses políticos e econômicos e legitimava dominação com ideias racistas.","id":"q-10","kind":"Questão autoral de treino"},{"subject":"his","prompt":"A Guerra Fria foi marcada por:","options":["Ausência de todos os conflitos militares","Aliança permanente entre EUA e URSS","Rivalidade entre blocos e corrida armamentista","Fim das disputas ideológicas","Controle da ONU sobre todas as armas"],"correct":2,"explanation":"A bipolaridade envolveu disputa ideológica, econômica e militar, inclusive conflitos locais, sem guerra direta entre as superpotências.","id":"q-11","kind":"Questão autoral de treino"},{"subject":"his","prompt":"O AI-5, em 1968, representou no Brasil:","options":["O fim da censura","A redemocratização imediata","O aprofundamento da repressão","A convocação de eleições presidenciais diretas","A extinção dos órgãos repressivos"],"correct":2,"explanation":"O AI-5 ampliou poderes autoritários e favoreceu censura, perseguição e restrições de direitos.","id":"q-12","kind":"Questão autoral de treino"},{"subject":"ing","prompt":"Em “Technology helps us. However, it also brings risks”, however estabelece:","options":["Adição","Causa","Contraste","Finalidade","Condição"],"correct":2,"explanation":"However introduz contraste entre os benefícios e a existência de riscos.","id":"q-13","kind":"Questão autoral de treino"},{"subject":"ing","prompt":"Procurar um horário específico em um anúncio em inglês é um exemplo de:","options":["Scanning","Skimming","Tradução integral","Resumo","Paráfrase"],"correct":0,"explanation":"Scanning é a busca rápida por uma informação específica.","id":"q-14","kind":"Questão autoral de treino"},{"subject":"ing","prompt":"A frase “AI may change jobs” expressa:","options":["Uma certeza absoluta","Uma possibilidade","Uma proibição","Um fato passado","Uma obrigação"],"correct":1,"explanation":"May pode indicar possibilidade. Não garante que a mudança ocorrerá da mesma forma em todos os trabalhos.","id":"q-15","kind":"Questão autoral de treino"},{"subject":"bio","prompt":"A síntese de proteínas ocorre diretamente nos:","options":["Lisossomos","Ribossomos","Cloroplastos exclusivamente","Centríolos","Vacúolos"],"correct":1,"explanation":"Os ribossomos realizam a tradução, formando cadeias de aminoácidos.","id":"q-16","kind":"Questão autoral de treino"},{"subject":"bio","prompt":"No cruzamento Aa × aa, com dominância completa, qual a chance de um descendente ter genótipo Aa?","options":["0%","25%","50%","75%","100%"],"correct":2,"explanation":"O primeiro indivíduo produz gametas A e a; o segundo, apenas a. Metade dos descendentes esperados é Aa.","id":"q-17","kind":"Questão autoral de treino"},{"subject":"bio","prompt":"O uso de um antibiótico em uma população bacteriana variável tende a:","options":["Fazer cada bactéria desejar resistência","Selecionar bactérias resistentes","Impedir qualquer mutação futura","Transformar todas as bactérias em vírus","Eliminar necessariamente todas as bactérias"],"correct":1,"explanation":"Bactérias resistentes podem sobreviver e se reproduzir. A seleção altera as frequências da população.","id":"q-18","kind":"Questão autoral de treino"},{"subject":"qui","prompt":"Uma solução de 100 mL e 2 mol/L é diluída até 500 mL, sem perda de soluto. A concentração final é:","options":["0,2 mol/L","0,4 mol/L","1 mol/L","2 mol/L","10 mol/L"],"correct":1,"explanation":"C₁V₁ = C₂V₂. Então C₂ = 2×100/500 = 0,4 mol/L.","id":"q-19","kind":"Questão autoral de treino"},{"subject":"qui","prompt":"Quando o NOX de um elemento passa de 0 para +2, ocorre:","options":["Redução","Oxidação","Fusão","Neutralização obrigatória","Sublimação"],"correct":1,"explanation":"O aumento do NOX corresponde à oxidação, associada à perda de elétrons.","id":"q-20","kind":"Questão autoral de treino"},{"subject":"qui","prompt":"Um átomo tem número de massa 35 e número atômico 17. Quantos nêutrons possui?","options":["17","18","35","52","16"],"correct":1,"explanation":"O número de nêutrons é A − Z = 35 − 17 = 18.","id":"q-21","kind":"Questão autoral de treino"},{"subject":"geo","prompt":"Em um mapa de escala 1:100.000, uma distância de 4 cm corresponde a:","options":["400 m","1 km","4 km","40 km","400 km"],"correct":2,"explanation":"4×100.000 = 400.000 cm = 4.000 m = 4 km.","id":"q-22","kind":"Questão autoral de treino"},{"subject":"geo","prompt":"Qual conjunto de estados corresponde ao nome Matopiba?","options":["Maranhão, Tocantins, Piauí e Bahia","Mato Grosso, Tocantins, Paraná e Bahia","Maranhão, Tocantins, Pará e Bahia","Mato Grosso, Piauí e Bahia","Minas Gerais, Tocantins, Piauí e Bahia"],"correct":0,"explanation":"O acrônimo corresponde a Maranhão, Tocantins, Piauí e Bahia.","id":"q-23","kind":"Questão autoral de treino"},{"subject":"geo","prompt":"A impermeabilização do solo urbano tende a aumentar:","options":["A infiltração da chuva","O escoamento superficial","A cobertura florestal","A evapotranspiração das árvores","A permeabilidade"],"correct":1,"explanation":"Com menos infiltração, maior parte da água escoa pela superfície, podendo sobrecarregar a drenagem.","id":"q-24","kind":"Questão autoral de treino"},{"subject":"fil","prompt":"O empirismo de Locke enfatiza como fonte do conhecimento:","options":["Ideias inatas exclusivamente","A experiência","O prestígio do orador","A tradição sem crítica","Somente demonstrações geométricas"],"correct":1,"explanation":"Locke destaca a experiência, por sensação e reflexão, na formação do conhecimento.","id":"q-25","kind":"Questão autoral de treino"},{"subject":"fil","prompt":"“Sua proposta é falsa porque você é jovem.” O problema do argumento é:","options":["Usar evidência pertinente","Demonstrar uma contradição","Atacar a pessoa em vez da proposta","Apresentar uma definição","Comparar dados"],"correct":2,"explanation":"A idade substitui a avaliação da proposta. É um exemplo de ad hominem.","id":"q-26","kind":"Questão autoral de treino"},{"subject":"fil","prompt":"Para o estoicismo, uma orientação importante é:","options":["Controlar todos os acontecimentos externos","Abandonar toda ação","Distinguir o que depende de nós do que não depende","Nunca examinar os próprios juízos","Evitar toda vida coletiva"],"correct":2,"explanation":"A distinção orienta o cuidado com escolhas e juízos, sem prometer controle sobre todos os resultados.","id":"q-27","kind":"Questão autoral de treino"},{"subject":"soc","prompt":"Julgar outras culturas como inferiores a partir dos próprios padrões é um exemplo de:","options":["Relativização contextual","Etnocentrismo","Interseccionalidade","Ação neutra","Pesquisa experimental"],"correct":1,"explanation":"O etnocentrismo toma a própria cultura como referência e hierarquiza outras.","id":"q-28","kind":"Questão autoral de treino"},{"subject":"soc","prompt":"Para Weber, uma ação social é orientada:","options":["Apenas por reflexos automáticos","Por um sentido que considera outras pessoas","Sempre por uma única causa biológica","Somente por lucros financeiros","Sem relação com contexto"],"correct":1,"explanation":"Ação social tem sentido para o agente e é orientada em relação a outras pessoas.","id":"q-29","kind":"Questão autoral de treino"},{"subject":"soc","prompt":"Uma associação estatística entre uso de redes e ansiedade permite concluir imediatamente que:","options":["As redes são a única causa","Todos os usuários têm ansiedade","A relação exige análise antes de afirmar causalidade","Não existe nenhum fator adicional","A amostra representa necessariamente toda a população"],"correct":2,"explanation":"Correlação não prova causalidade. É preciso examinar método, amostra, fatores associados e limites da pesquisa.","id":"q-30","kind":"Questão autoral de treino"}],"exams":[{"id":"fuvest25","title":"Fuvest 2025","subtitle":"Primeira fase · versão V1","count":90,"minutes":300,"url":"https://drive.google.com/file/d/1QDaZh3FS1zxv7f4UNo_REyo_bMqTLLe8/view","pdf":"/provas/fuvest2025.pdf","kind":"Fuvest / USP"},{"id":"sare-lt","title":"SARESP 2025","subtitle":"Linguagens, Natureza e Redação · caderno 1","count":48,"minutes":null,"url":"https://drive.google.com/file/d/10ls6FfeuSgqT-g-CjI-mUMoVoZLRmLAh/view","pdf":"/provas/saresp-linguagens.pdf","kind":"SARESP"},{"id":"sare-mt","title":"SARESP 2025","subtitle":"Matemática e Humanas · caderno 1","count":42,"minutes":null,"url":"https://drive.google.com/file/d/1vdYDc1NrKWHXnSF1JagDXyjUq7edorXp/view","pdf":"/provas/saresp-matematica.pdf","kind":"SARESP"},{"id":"enem2022-1","title":"ENEM 2022","subtitle":"1º dia · Linguagens, Humanas e Redação","count":90,"minutes":330,"url":"https://drive.google.com/file/d/19GlSsure4aQ2wzOvucNsZAVReDSlWKjp/view","kind":"ENEM"},{"id":"enem2023-1","title":"ENEM 2023","subtitle":"1º dia · Linguagens, Humanas e Redação","count":90,"minutes":330,"url":"https://drive.google.com/file/d/1dYi5-xg8U9nw7PycVcYEaVercWBPH1ho/view","kind":"ENEM"},{"id":"enem2024-1","title":"ENEM 2024","subtitle":"1º dia · Linguagens, Humanas e Redação","count":90,"minutes":330,"url":"https://drive.google.com/file/d/1kSI-aWo0jfqbDd1mpliBi-Ky6vRCDXmU/view","kind":"ENEM"},{"id":"enem2025-1","title":"ENEM 2025","subtitle":"1º dia · Linguagens, Humanas e Redação","count":90,"minutes":330,"url":"https://drive.google.com/file/d/1bwat9SgWZU4TsF4SvnUfKR8Y-i_LNyS4/view","kind":"ENEM"},{
