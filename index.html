const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cards=CONTENT.lessons.flatMap(l=>l.cards.map(c=>({...c,subject:l.subject,lesson:l.id})));
const blank=()=>({done:[],reviews:{},attempts:[],goal:'ENEM'});
let saved=blank(),storageOK=true;try{const raw=JSON.parse(localStorage.getItem('nexo-simple-v1')||'null');if(raw&&Array.isArray(raw.done)&&raw.reviews&&typeof raw.reviews==='object'&&Array.isArray(raw.attempts))saved={...blank(),...raw}}catch{storageOK=false}
let view=['home','subjects','flashcards','simulations','progress','writing','library'].includes(location.hash.slice(1))?location.hash.slice(1):'home',subject='all',term='',queue=[],flipped=false,quiz=null,toastTimer,searchTimer;
const nav=[['home','⌂','Meu dia'],['subjects','▤','Matérias'],['flashcards','▱','Flashcards'],['simulations','◉','Simulados'],['progress','▥','Progresso'],['writing','✎','Redação'],['library','⊞','Biblioteca']];
const info=id=>CONTENT.subjects.find(s=>s.id===id),done=id=>saved.done.includes(id),due=()=>cards.filter(c=>!saved.reviews[c.id]||saved.reviews[c.id].due<=Date.now());
function persist(){try{localStorage.setItem('nexo-simple-v1',JSON.stringify(saved))}catch{storageOK=false;toast('Seu navegador não permitiu salvar. O progresso vale somente nesta sessão.')}}
function toast(text){$('#toast').textContent=text;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),4500)}
function go(next,sub='all'){if(quiz&&!quiz.result&&view==='practice'&&!confirm('Sair do treino? As respostas desta sessão serão descartadas.'))return;close();view=next;subject=sub;term='';if(next!=='practice'&&next!=='result')quiz=null;history.replaceState(null,'','#'+next);render();window.scrollTo(0,0)}
const brand=()=>'<div class="brand"><b>n</b>nexo<i>.</i></div>';
const heading=(title,description)=>`<div class="heading"><div><h1>${title}</h1><p class="sub">${description}</p></div><span class="pill">3ª série · Ensino Médio</span></div>`;
function stats(){const total=saved.attempts.reduce((a,b)=>a+b.total,0),correct=saved.attempts.reduce((a,b)=>a+b.score,0);return `<div class="stats">${[[saved.done.length,'Resumos concluídos'],[Object.keys(saved.reviews).length,'Flashcards revisados'],[saved.attempts.length,'Treinos finalizados'],[total?Math.round(correct/total*100)+'%':'—','Acertos em treinos']].map(([n,l])=>`<div class="stat"><b>${n}</b><small>${l}</small></div>`).join('')}</div>`}
function subjectCard(s){const lessons=CONTENT.lessons.filter(l=>l.subject===s.id),n=lessons.filter(l=>done(l.id)).length,pct=Math.round(n/lessons.length*100);return `<button class="subject" style="--color:${s.color}" data-subject="${s.id}"><span class="symbol">${s.symbol}</span><h3>${s.name}</h3><p>${lessons.length} resumos · ${lessons.length*3} cards</p><div class="track"><span style="width:${pct}%"></span></div><div class="progress-meta"><span>${n} de ${lessons.length} concluídos</span><span>${pct}%</span></div></button>`}
function home(){const next=CONTENT.lessons.find(l=>!done(l.id))||CONTENT.lessons[0];return `${heading('Vamos dar o próximo passo?','Um tema por vez. Mais confiança a cada revisão.')}<section class="hero"><div><div class="eyebrow">Seu estudo começa aqui</div><h2>Conecte ideias.<br>Construa o seu futuro.</h2><p>Retome um conteúdo, revise o que aprendeu e coloque seu conhecimento em prática.</p><div class="actions"><button class="btn lime" data-action="review">Revisar flashcards</button><button class="btn outline" data-lesson="${next.id}">Continuar estudando</button></div></div><div class="geometry" aria-hidden="true"><strong>n</strong></div></section>${stats()}<div class="section-head"><h2>Explore suas matérias</h2><button class="text" data-go="subjects">Todas as matérias</button></div><div class="grid">${CONTENT.subjects.slice(0,6).map(subjectCard).join('')}</div><div class="two"><section class="panel"><h2>Um plano para hoje</h2><div class="daily"><div class="daily-item"><span class="step">1</span><div><h3>Leia um resumo</h3><p>${next.title} · ${next.minutes} min</p></div></div><div class="daily-item"><span class="step">2</span><div><h3>Revise sua memória</h3><p>${due().length} cards disponíveis para revisar</p></div></div><div class="daily-item"><span class="step">3</span><div><h3>Teste uma ideia</h3><p>Um treino curto, com correção explicada</p></div></div></div></section><section class="panel"><div class="eyebrow">Meu objetivo</div><h2>Para onde você quer ir?</h2><select id="goal" class="chip" aria-label="Objetivo de estudos" style="margin:18px 0;width:100%">${['ENEM','Fuvest / USP','ITA','Provão Paulista'].map(g=>`<option ${saved.goal===g?'selected':''}>${g}</option>`).join('')}</select><p class="small">A biblioteca mostra quais provas e conteúdos já fazem parte desta coleção.</p><div class="actions"><button class="btn soft" data-go="simulations">Começar um treino</button><button class="text" data-go="library">Consultar cobertura</button></div></section></div>`}
function filters(){return `<div class="filter"><button class="chip ${subject==='all'?'on':''}" data-filter="all">Todas</button>${CONTENT.subjects.map(s=>`<button class="chip ${subject===s.id?'on':''}" data-filter="${s.id}">${s.name}</button>`).join('')}</div>`}
function subjects(){const ls=CONTENT.lessons.filter(l=>(subject==='all'||l.subject===subject)&&(!term||(l.title+' '+l.topic+' '+info(l.subject).name).toLocaleLowerCase('pt-BR').includes(term.toLocaleLowerCase('pt-BR'))));return `${heading('Conhecimento que faz sentido.','Leia, conecte conceitos e marque cada etapa concluída.')}${filters()}${!term&&subject==='all'?`<div class="grid">${CONTENT.subjects.map(subjectCard).join('')}</div><div class="section-head" style="margin-top:28px"><h2>Todos os resumos</h2></div>`:''}<div class="grid">${ls.length?ls.map(l=>`<article class="panel lesson"><div class="small">${info(l.subject).name} · ${l.minutes} min</div><h3>${l.title}</h3><span class="tag">${l.topic}</span><button class="btn ${done(l.id)?'soft':''}" data-lesson="${l.id}">${done(l.id)?'✓ Ler novamente':'Estudar resumo'}</button></article>`).join(''):'<div class="panel empty"><h3>Nenhum tema encontrado</h3><p>Tente outro termo ou selecione outra matéria.</p></div>'}</div>`}
function startReview(sub='all'){close();subject=sub;queue=due().filter(c=>sub==='all'||c.subject===sub).slice(0,10);flipped=false;view='flashcards';quiz=null;history.replaceState(null,'','#flashcards');render();window.scrollTo(0,0)}
function flashcards(){const c=queue[0];return `${heading('Uma ideia de cada vez.','Pense na resposta antes de virar o card. Depois, avalie como foi.')}${filters()}<div class="flash-area">${c?`<div class="section-head"><span class="small">${info(c.subject).name}</span><span class="pill">${queue.length} cards nesta sessão</span></div><div class="flash-stage"><button class="flash ${flipped?'flipped':''}" data-action="flip" aria-label="${flipped?'Voltar à pergunta':'Mostrar resposta'}"><div class="face" ${flipped?'aria-hidden="true"':''}><div class="eyebrow">Pergunta</div><h2>${esc(c.question)}</h2><span class="small">Toque para revelar a resposta</span></div><div class="face back" ${!flipped?'aria-hidden="true"':''}><div class="eyebrow">Resposta</div><h2>${esc(c.answer)}</h2></div></button></div><div class="flash-controls">${[[0,'Rever em breve'],[1,'Com esforço'],[2,'Lembrei bem']].map(([r,l])=>`<button class="btn ${r===2?'':'outline'}" data-rating="${r}" ${!flipped?'disabled':''}>${l}</button>`).join('')}</div>`:`<div class="panel empty"><h2>Sua próxima revisão começa aqui.</h2><p>Faça uma sessão de até 10 cards. Os próximos retornos ficam registrados neste navegador.</p><button class="btn" data-action="review">Começar revisão</button>${due().filter(c=>subject==='all'||c.subject===subject).length===0?'<p>Você está em dia com esta matéria. Volte mais tarde para revisar.</p>':''}</div>`}</div>`}
function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(sub='all'){const qs=shuffle(CONTENT.questions.filter(q=>sub==='all'||q.subject===sub)).slice(0,10);quiz={questions:qs,index:0,answers:{},started:Date.now()};view='practice';subject=sub;render();window.scrollTo(0,0)}
function simulations(){return `${heading('Pratique com intenção.','Treinos autorais corrigidos e cadernos oficiais para consultar.')}<section class="panel"><div class="eyebrow">Treino com correção</div><h2>Descubra o que você já domina.</h2><p class="sub">Responda até 10 questões e entenda cada resposta ao finalizar.</p><div class="actions"><select id="quiz-subject" class="chip" aria-label="Matéria do treino"><option value="all">Todas as matérias</option>${CONTENT.subjects.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select><button class="btn" data-action="custom-quiz">Iniciar treino</button></div></section><div class="section-head" style="margin-top:28px"><h2>Cadernos oficiais</h2></div><p class="note">Os PDFs preservam as provas originais. Sem gabaritos oficiais associados, esta versão não calcula nota para esses cadernos. Arquivos do Drive podem exigir acesso à pasta original.</p><div class="grid">${CONTENT.exams.map(e=>`<article class="panel lesson"><span class="tag">${e.kind}</span><h3>${e.title}</h3><p class="small">${e.subtitle}</p><p class="small">${e.count} questões${e.minutes?' · '+e.minutes+' min':''}</p><a class="btn outline" href="${e.url}" target="_blank" rel="noopener">Abrir prova original</a></article>`).join('')}</div>`}
function practice(){const q=quiz.questions[quiz.index],n=quiz.questions.length;return `${heading('Respire. Pense. Conecte.','Escolha a alternativa que melhor responde à questão.')}<div class="quiz"><div class="section-head"><span class="small">${info(q.subject).name}</span><span class="pill">Questão ${quiz.index+1} de ${n}</span></div><div class="track" style="margin-bottom:20px"><span style="width:${(quiz.index+1)/n*100}%"></span></div><div class="panel"><span class="tag">Questão autoral</span><h2 style="margin-top:18px">${esc(q.prompt)}</h2><div class="options">${q.options.map((o,i)=>`<button class="option ${quiz.answers[q.id]===i?'chosen':''}" data-answer="${i}" aria-pressed="${quiz.answers[q.id]===i}"><b>${'ABCDE'[i]}</b><span>${esc(o)}</span></button>`).join('')}</div><div class="quiz-controls"><button class="btn outline" data-action="previous" ${quiz.index===0?'disabled':''}>Anterior</button>${quiz.index<n-1?'<button class="btn" data-action="next">Próxima questão</button>':'<button class="btn" data-action="finish">Finalizar treino</button>'}</div></div></div>`}
function finish(){if(quiz.questions.some(q=>quiz.answers[q.id]===undefined)){toast('Responda todas as questões antes de finalizar.');return}quiz.result=quiz.questions.filter(q=>quiz.answers[q.id]===q.correct).length;saved.attempts.unshift({id:Date.now(),date:Date.now(),score:quiz.result,total:quiz.questions.length,subject});saved.attempts=saved.attempts.slice(0,50);persist();view='result';render();window.scrollTo(0,0)}
function result(){return `${heading('Cada treino ensina alguma coisa.','Confira as respostas e retome os conceitos que precisam de atenção.')}<div class="quiz"><div class="panel"><span class="tag">Seu resultado</span><div class="score">${quiz.result}<span style="font-size:1.5rem;font-weight:400"> / ${quiz.questions.length}</span></div><p class="small">${Math.round(quiz.result/quiz.questions.length*100)}% de acerto nas questões autorais</p><div class="actions"><button class="btn" data-action="new-quiz">Novo treino</button><button class="btn outline" data-go="subjects">Voltar aos resumos</button></div></div>${quiz.questions.map((q,i)=>`<div class="feedback ${quiz.answers[q.id]===q.correct?'':'wrong'}"><h3>${i+1}. ${esc(q.prompt)}</h3><p>Sua resposta: <strong>${'ABCDE'[quiz.answers[q.id]]}. ${esc(q.options[quiz.answers[q.id]])}</strong></p><p>Resposta correta: <strong>${'ABCDE'[q.correct]}. ${esc(q.options[q.correct])}</strong></p><p>${esc(q.explanation)}</p></div>`).join('')}</div>`}
function progress(){return `${heading('Veja suas ideias se conectando.','Seu progresso é guardado somente neste navegador.')}${stats()}<div class="note">${storageOK?'Os dados ficam neste aparelho e navegador. Limpar os dados do navegador apaga o histórico.':'O navegador não permitiu salvar dados. Seu progresso está disponível apenas nesta sessão.'}</div><div class="two"><section class="panel"><h2>Por matéria</h2><div class="history">${CONTENT.subjects.map(s=>{const ls=CONTENT.lessons.filter(l=>l.subject===s.id),n=ls.filter(l=>done(l.id)).length;return `<div><div class="section-head"><span>${s.name}</span><span class="small">${n}/${ls.length} resumos</span></div><div class="track" style="--color:${s.color}"><span style="width:${n/ls.length*100}%"></span></div></div>`}).join('')}</div></section><section class="panel"><h2>Últimos treinos</h2><div class="history">${saved.attempts.length?saved.attempts.slice(0,10).map(a=>`<div class="history-item"><div><strong>${a.subject==='all'?'Treino geral':info(a.subject)?.name||'Treino'}</strong><p class="small">${new Date(a.date).toLocaleDateString('pt-BR')}</p></div><strong>${a.score}/${a.total}</strong></div>`).join(''):'<p class="small">Você ainda não finalizou um treino. Seu primeiro resultado aparecerá aqui.</p>'}</div><div class="actions"><button class="btn" data-go="simulations">Praticar agora</button></div></section></div><div class="actions"><button class="text" data-action="reset">Limpar meu progresso neste navegador</button></div>`}
function writing(){return `${heading('Dê forma às suas ideias.','Planeje sua tese, seus argumentos e a conclusão.')}<p class="note">O planejamento pode ser exportado em texto. O rascunho não é salvo automaticamente; exporte antes de fechar.</p><div class="grid writing">${CONTENT.writing.map((w,i)=>`<section class="panel"><span class="tag">${w.year}</span><h3>${esc(w.title)}</h3><button class="btn outline" data-writing="${i}">Planejar redação</button></section>`).join('')}</div>`}
function library(){const sources=[...new Map(CONTENT.lessons.map(l=>[l.source.url,l.source])).values()];return `${heading('Uma base que você pode consultar.','As referências dos temas e os limites da coleção.')}<p class="note">Os resumos, flashcards e treinos são autorais, elaborados a partir dos materiais recebidos. Consulte as fontes para exercícios, figuras e textos completos.</p><div class="grid">${sources.map(s=>`<section class="panel source"><h3>${s.title}</h3><p class="small" style="margin:12px 0">Material de referência</p><a href="${s.url}" target="_blank" rel="noopener">Consultar original</a></section>`).join('')}</div><section class="panel" style="margin-top:24px"><h2>Cobertura atual</h2><p class="sub">40 resumos · 120 flashcards · 30 questões autorais · 10 cadernos oficiais · 5 propostas de redação.</p><p class="coverage">Esta é uma coleção inicial. Há cadernos de ENEM, Fuvest e SARESP. Ainda faltam gabaritos oficiais, provas do ITA, a segunda fase da Fuvest e materiais didáticos integrais de algumas matérias. Os temas não equivalem ao currículo completo de todos os vestibulares.</p></section>`}
function render(){const functions={home,subjects,flashcards,simulations,practice,result,progress,writing,library};$('#app').innerHTML=`<aside class="sidebar">${brand()}<p class="nav-label">SEU ESPAÇO DE ESTUDOS</p><nav aria-label="Navegação principal">${nav.map(([id,symbol,label])=>`<button class="nav ${view===id||id==='simulations'&&['practice','result'].includes(view)?'active':''}" data-go="${id}"><span aria-hidden="true">${symbol}</span>${label}</button>`).join('')}</nav><div class="side-note"><strong>Aprender é conectar.</strong>Seu próximo passo começa com uma ideia.</div></aside><div class="layout"><header class="top">${brand()}<span class="crumb">Seu espaço / <strong>${nav.find(n=>n[0]===view)?.[2]||'Treino'}</strong></span><input id="find" class="search" type="search" aria-label="Buscar temas de estudo" placeholder="Buscar um tema…" value="${esc(term)}"></header><main class="main" id="main">${(functions[view]||home)()}<p class="foot">Nexo · Estudos para a 3ª série. Seu progresso fica neste navegador.</p></main></div>`}

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.go){go(b.dataset.go);return}if(b.dataset.subject){go('subjects',b.dataset.subject);return}
 if(b.dataset.filter){subject=b.dataset.filter;if(view==='flashcards')startReview(subject);else render();return}
 if(b.dataset.lesson){lesson(b.dataset.lesson);return}
 if(b.dataset.complete){if(!done(b.dataset.complete))saved.done.push(b.dataset.complete);persist();lesson(b.dataset.complete);render();toast('Resumo concluído. Mais uma ideia conectada.');return}
 if(b.dataset.cards){startReview(b.dataset.cards);return}
 if(b.dataset.rating!==undefined){if(!flipped||!queue[0])return;const c=queue[0],rating=Number(b.dataset.rating),old=saved.reviews[c.id],interval=rating===0?0:rating===1?1:Math.min(60,Math.max(3,(old?.interval||1)*2));saved.reviews[c.id]={due:Date.now()+(interval?interval*86400000:600000),interval};persist();queue.shift();flipped=false;render();if(!queue.length)toast('Sessão concluída. Suas próximas revisões estão programadas.');return}
 if(b.dataset.answer!==undefined){quiz.answers[quiz.questions[quiz.index].id]=Number(b.dataset.answer);render();return}
 if(b.dataset.writing!==undefined){const w=CONTENT.writing[Number(b.dataset.writing)];modal(w.year,`<h1>${esc(w.title)}</h1><p class="sub">Esboce sua posição e organize as ideias antes de escrever.</p><form id="writing-form"><label class="field"><span>Minha tese</span><textarea name="thesis" placeholder="Qual posição você vai defender?"></textarea></label><label class="field"><span>Argumentos e repertório</span><textarea name="arguments" placeholder="Quais razões e exemplos sustentam sua tese?"></textarea></label><label class="field"><span>Conclusão</span><textarea name="conclusion" placeholder="Como fechar o argumento? Se necessário, detalhe uma proposta de solução."></textarea></label><input type="hidden" name="title" value="${esc(w.title)}"><button class="btn" type="submit">Exportar meu planejamento</button></form>`);return}
 const a=b.dataset.action;if(a==='close')close();if(a==='review')startReview(subject);if(a==='flip'){flipped=!flipped;render()}if(a==='custom-quiz')startQuiz($('#quiz-subject').value);if(a==='new-quiz')startQuiz(subject);if(a==='previous'){quiz.index--;render()}if(a==='next'){quiz.index++;render()}if(a==='finish')finish();if(a==='reset'&&confirm('Apagar os resumos concluídos, revisões e treinos deste navegador?')){saved=blank();persist();queue=[];render();toast('Progresso deste navegador limpo.')}
});
document.addEventListener('input',e=>{if(e.target.id==='find'){const value=e.target.value;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{if(view==='practice'&&!quiz.result){toast('Finalize ou saia do treino antes de buscar.');return}term=value;subject='all';view='subjects';render();$('#find').focus();$('#find').setSelectionRange(value.length,value.length)},200)}});
document.addEventListener('change',e=>{if(e.target.id==='goal'){saved.goal=e.target.value;persist();toast('Objetivo atualizado neste navegador.')}});
document.addEventListener('submit',e=>{if(e.target.id!=='writing-form')return;e.preventDefault();const f=new FormData(e.target),text=`${f.get('title')}\n\nTESE\n${f.get('thesis')}\n\nARGUMENTOS\n${f.get('arguments')}\n\nCONCLUSÃO\n${f.get('conclusion')}`,url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='redacao-nexo.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Planejamento exportado.')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
render();
</script>
</body></html>
